<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">ARAMGG Assistant</title>
  <desc id="desc">A read-only League of Legends ARAM companion with champion-select guidance, local Augment OCR, and in-game recommendation overlays.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c27a"/>
      <stop offset="1" stop-color="#c29c6d"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8a96a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c8a96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1075" cy="62" r="248" fill="url(#signal)"/>
  <path d="M64 370H1136" stroke="#c8a96a" stroke-opacity=".18"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(64 54)">
      <rect width="400" height="34" rx="17" fill="#162231" stroke="#c8a96a" stroke-opacity=".32"/>
      <circle cx="20" cy="17" r="5" fill="#54d884"/>
      <text x="36" y="23" fill="#d6cdbd" font-size="18" font-weight="600" letter-spacing="1.4">WINDOWS · ARAM COMPANION</text>
    </g>

    <text x="64" y="172" fill="#f4ecdc" font-size="76" font-weight="800" letter-spacing="-2">ARAMGG</text>
    <text x="68" y="215" fill="url(#gold)" font-size="34" font-weight="700" letter-spacing="8">ASSISTANT</text>

    <text x="66" y="269" fill="#f4ecdc" font-size="25" font-weight="650">Read the match.</text>
    <text x="66" y="303" fill="#a99f8c" font-size="25">Keep every decision yours.</text>

    <g transform="translate(64 329)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="20" fill="#c8a96a" font-size="18" font-weight="700">01</text>
      <text x="34" y="20" fill="#a99f8c" font-size="18">LCU / READ ONLY</text>
      <text x="222" y="20" fill="#c8a96a" font-size="18" font-weight="700">02</text>
      <text x="256" y="20" fill="#a99f8c" font-size="18">OCR / LOCAL</text>
      <text x="410" y="20" fill="#c8a96a" font-size="18" font-weight="700">03</text>
      <text x="444" y="20" fill="#a99f8c" font-size="18">DATA / LOCAL FIRST</text>
    </g>
  </g>

  <g id="augment-readout"
     transform="translate(694 38)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="442" height="344" rx="16" fill="#111923" stroke="#c8a96a" stroke-opacity=".34"/>
    <path d="M0 52H442" stroke="#f4ecdc" stroke-opacity=".09"/>
    <circle cx="24" cy="26" r="6" fill="#54d884"/>
    <text x="42" y="33" fill="#f4ecdc" font-size="19" font-weight="700" letter-spacing="1.5">AUGMENT READOUT</text>
    <text x="331" y="32" fill="#a99f8c" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">L · C · R</text>

    <g id="augment-card-left" transform="translate(28 78)">
      <rect width="112" height="182" rx="9" fill="#0b1117" stroke="#e2c27a" stroke-width="2"/>
      <text x="14" y="27" fill="#a99f8c" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
      <circle cx="56" cy="80" r="26" fill="none" stroke="#e2c27a" stroke-width="4"/>
      <circle cx="56" cy="80" r="8" fill="#e2c27a"/>
      <path d="M56 43V55M56 105V117M19 80H31M81 80H93" stroke="#e2c27a" stroke-width="4" stroke-linecap="round"/>
      <text x="15" y="145" fill="#f4ecdc" font-size="18" font-weight="700">53.1%</text>
      <rect x="15" y="158" width="82" height="5" rx="2.5" fill="#1c2a39"/>
      <rect x="15" y="158" width="62" height="5" rx="2.5" fill="#c8a96a"/>
    </g>

    <g id="augment-card-center" transform="translate(165 78)">
      <rect width="112" height="182" rx="9" fill="#0b1117" stroke="#f4ecdc" stroke-opacity=".15"/>
      <text x="14" y="27" fill="#a99f8c" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
      <path d="M56 49L82 59V78C82 97 71 109 56 117C41 109 30 97 30 78V59L56 49Z"
            fill="none" stroke="#d6cdbd" stroke-width="4" stroke-linejoin="round"/>
      <path d="M56 61V103" stroke="#d6cdbd" stroke-width="4" stroke-linecap="round"/>
      <text x="15" y="145" fill="#f4ecdc" font-size="18" font-weight="700">50.0%</text>
      <rect x="15" y="158" width="82" height="5" rx="2.5" fill="#1c2a39"/>
      <rect x="15" y="158" width="48" height="5" rx="2.5" fill="#6f7a82"/>
    </g>

    <g id="augment-card-right" transform="translate(302 78)">
      <rect width="112" height="182" rx="9" fill="#0b1117" stroke="#f4ecdc" stroke-opacity=".15"/>
      <text x="14" y="27" fill="#a99f8c" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
      <path d="M37 106L72 57L83 52L78 64L47 113Z" fill="none" stroke="#d6cdbd" stroke-width="4" stroke-linejoin="round"/>
      <path d="M34 98L52 116M29 112L42 99" stroke="#d6cdbd" stroke-width="4" stroke-linecap="round"/>
      <text x="15" y="145" fill="#f4ecdc" font-size="18" font-weight="700">47.9%</text>
      <rect x="15" y="158" width="82" height="5" rx="2.5" fill="#1c2a39"/>
      <rect x="15" y="158" width="39" height="5" rx="2.5" fill="#6f7a82"/>
    </g>

    <g transform="translate(28 282)">
      <rect width="386" height="40" rx="8" fill="#162231" stroke="#f4ecdc" stroke-opacity=".08"/>
      <text x="16" y="26" fill="#a99f8c" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LCU</text>
      <path d="M64 20H248" stroke="#c8a96a" stroke-opacity=".45" stroke-dasharray="5 7"/>
      <circle cx="265" cy="20" r="6" fill="#54d884"/>
      <text x="282" y="26" fill="#f4ecdc" font-size="18" font-weight="700">READ ONLY</text>
    </g>
  </g>
</svg>
